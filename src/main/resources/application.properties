# Configuração conforme a Atividade 16 (slide 373)
server.port=${PORT:8080}
spring.application.name=produtos-frontend

# Arquivos estáticos em src/main/resources/static
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Sem necessidade de templates dinâmicos
spring.thymeleaf.enabled=false

# Integração adicional: endereço da API backend
# Para testar localmente com os dois projetos, rode o backend na porta 8081.
# Em hospedagem, defina BACKEND_API_BASE_URL para uma URL pública HTTPS da API.
backend.api.base-url=${BACKEND_API_BASE_URL:http://localhost:8081/produtos}
